name: Unit Test Run
description: Unit test run

inputs:
  tf_version:
    description: 'TensorFlow version'
  python_version:
    description: 'Python version'
  ort_version:
    description: 'ONNXRuntime version'
  onnx_version:
    description: 'ONNX version'
  opset_version:
    description: 'OPSET version'
  skip_tflite:
    description: 'Skip TFLite tests'
  numpy_spec:
    description: 'pip requirement spec for numpy (e.g. "numpy<2" or "numpy>=2")'
    default: 'numpy<2'

runs:
  using: "composite"
  steps:
    - name: Set up Python (${{ inputs.python_version }})
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install dependencies (TF-v${{ inputs.tf_version }})
      shell: bash
      env:
        TF_VERSION: ${{ inputs.tf_version }}
        ORT_VERSION: ${{ inputs.ort_version }}
        ONNX_VERSION: ${{ inputs.onnx_version }}
        NUMPY_SPEC: ${{ inputs.numpy_spec }}
      run: |
        chmod +x ./tests/utils/setup_test_env.sh
        ./tests/utils/setup_test_env.sh "$TF_VERSION" "$ORT_VERSION" "$ONNX_VERSION" "$NUMPY_SPEC"

    - name: Fix Paths (Windows only)
      shell: pwsh
      if: runner.os == 'Windows'
      run: |
        $site_dir = python -c "import site; print(site.getsitepackages()[1])"
        echo "##vso[task.prependpath]$site_dir\numpy\.libs"
        $base_dir = python -c "import site; print(site.getsitepackages()[0])"
        echo "##vso[task.prependpath]$base_dir/Library/bin"

    - name: Run unit_test (Linux)
      shell: bash
      if: runner.os == 'Linux'
      env:
        TF2ONNX_TEST_OPSET: ${{ inputs.opset_version }}
        TF2ONNX_SKIP_TFLITE_TESTS: ${{ inputs.skip_tflite }}
      run: |
        export TF2ONNX_TEST_BACKEND=onnxruntime
        export TF2ONNX_TEST_OPSET
        export TF2ONNX_SKIP_TFLITE_TESTS
        export TF2ONNX_SKIP_TFJS_TESTS=True
        export TF2ONNX_SKIP_TF_TESTS=False
        # fork-only diagnostic: memory + OOM-killer lines inline in this step's log
        (while sleep 5; do echo "MEM $(date +%T) $(free -m | sed -n 2p) | top: $(ps -eo rss=,args= --sort=-rss | head -4 | awk '{printf "%dMB %s; ", $1/1024, substr($2,1,20)}')"; done) &
        (sudo dmesg -wT 2>/dev/null | grep --line-buffered -i -E "oom|killed process|out of memory" | sed 's/^/KERNEL /') &
        python -m pytest -n logical --cov=tf2onnx --cov-report=term --disable-pytest-warnings -r s tests --ignore=tests/test_pretrained_models.py --cov-append --junitxml=junit/test-results.xml
        # Pretrained-model conversions need up to ~8 GB each; run them serially so they don't stack.
        python -m pytest --cov=tf2onnx --cov-report=term --disable-pytest-warnings -r s tests/test_pretrained_models.py --cov-append --junitxml=junit/test-results-pretrained.xml
        ls

    - name: Run unit_test (Windows)
      shell: pwsh
      if: runner.os == 'Windows'
      env:
        TF2ONNX_TEST_OPSET: ${{ inputs.opset_version }}
        TF2ONNX_SKIP_TFLITE_TESTS: ${{ inputs.skip_tflite }}
      run: |
        $env:TF2ONNX_TEST_BACKEND = "onnxruntime"
        $env:TF2ONNX_SKIP_TFJS_TESTS = "True"
        $env:TF2ONNX_SKIP_TF_TESTS = "False"
        python -m pytest -n logical --cov=tf2onnx --cov-report=term --disable-pytest-warnings -r s tests --ignore=tests/test_pretrained_models.py --cov-append --junitxml=junit/test-results.xml
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # Pretrained-model conversions need up to ~8 GB each; run them serially so they don't stack.
        python -m pytest --cov=tf2onnx --cov-report=term --disable-pytest-warnings -r s tests/test_pretrained_models.py --cov-append --junitxml=junit/test-results-pretrained.xml
        ls
